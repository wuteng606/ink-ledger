<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @page { size: 1080px 1440px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1440px; overflow: hidden; position: relative;
    font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", system-ui, sans-serif;
    color: #F2F4F8;
    background:
      radial-gradient(880px 680px at 88% -6%, rgba(232,180,100,.20), rgba(232,180,100,0) 62%),
      radial-gradient(700px 560px at 0% 100%, rgba(78,120,210,.10), rgba(78,120,210,0) 60%),
      linear-gradient(168deg, #12151C 0%, #0C0E13 50%, #08090C 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(680px 680px at 50% 22%, #000 0%, transparent 78%);
  }
  .wrap { position: relative; height: 100%; padding: 72px 78px 60px;
          display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 54px; height: 54px; border-radius: 16px;
    background: linear-gradient(150deg, #F2C988, #C0892C);
    box-shadow: 0 12px 26px rgba(200,140,52,.3), inset 0 1px 0 rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: #1A1206;
  }
  .brand-t { font-size: 24px; font-weight: 700; color: #EDEFF4; }
  .kbd-pill {
    padding: 10px 20px; border-radius: 999px; font-size: 18px; font-weight: 600;
    color: #E8B464; background: rgba(232,180,100,.10);
    border: 1px solid rgba(232,180,100,.26);
    font-family: "SF Mono", Menlo, monospace;
  }

  h1 {
    margin-top: 46px;
    font-size: 96px; line-height: 1.15; letter-spacing: -2.5px; font-weight: 800;
  }
  h1 .hl {
    background: linear-gradient(170deg, #F8DCA8 0%, #E8B464 46%, #C0892C 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin-top: 24px; font-size: 30px; color: #98A1B2; font-weight: 500; }
  .sub b { color: #E8B464; font-weight: 600; }

  .shot {
    margin-top: 36px; margin-bottom: auto; align-self: center; width: 690px; flex-shrink: 0;
    filter: drop-shadow(0 50px 70px rgba(0,0,0,.72));
  }
  .shot img { display: block; width: 100%; }

  .chips { margin-top: auto; display: flex; gap: 16px; }
  .chip {
    flex: 1; padding: 24px 14px; border-radius: 22px; text-align: center;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.07);
  }
  .chip .k { font-size: 27px; font-weight: 800; color: #F0E2C8; }
  .chip .v { margin-top: 6px; font-size: 17px; color: #78818F; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">账</div>
        <div class="brand-t">墨账 Ink Ledger</div>
      </div>
      <div class="kbd-pill">⌘ N</div>
    </div>

    <h1>三步，<span class="hl">记完一笔</span></h1>

    <div class="sub">金额 → 分类 → 回车，<b>不到五秒</b></div>

    <div class="shot">
      <img src="file:///Volumes/Extra/Projects/workbuddy/mini-tool/mini-ledger/design/screenshot-entry.png">
    </div>

    <div class="chips">
      <div class="chip"><div class="k">12 个分类</div><div class="v">支出收入分开</div></div>
      <div class="chip"><div class="k">双击改</div><div class="v">记错了随手修正</div></div>
      <div class="chip"><div class="k">记住上次</div><div class="v">账户不用反复选</div></div>
    </div>
  </div>
</body>
</html>
