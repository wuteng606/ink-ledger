<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @page { size: 1080px 1440px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1440px; overflow: hidden; position: relative;
    font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", system-ui, sans-serif;
    color: #F2F4F8;
    background:
      radial-gradient(920px 720px at 12% -12%, rgba(232,180,100,.22), rgba(232,180,100,0) 64%),
      radial-gradient(760px 620px at 104% 96%, rgba(78,120,210,.13), rgba(78,120,210,0) 62%),
      linear-gradient(168deg, #12151C 0%, #0C0E13 48%, #08090C 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(700px 700px at 50% 28%, #000 0%, transparent 78%);
  }

  .wrap { position: relative; height: 100%; padding: 72px 78px 64px;
          display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo {
    width: 62px; height: 62px; border-radius: 18px;
    background: linear-gradient(150deg, #F2C988, #C0892C);
    box-shadow: 0 14px 30px rgba(200,140,52,.34), inset 0 1px 0 rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #1A1206;
  }
  .brand-t { font-size: 27px; font-weight: 700; letter-spacing: .5px; color: #EDEFF4; }
  .brand-s { font-size: 18px; color: #7A8394; margin-top: 3px; letter-spacing: .5px; }
  .badge {
    padding: 12px 22px; border-radius: 999px; font-size: 19px; font-weight: 600;
    color: #E8B464; background: rgba(232,180,100,.10);
    border: 1px solid rgba(232,180,100,.28);
  }

  h1 {
    margin-top: 44px;
    font-size: 104px; line-height: 1.16; letter-spacing: -3px; font-weight: 800;
    color: #F4F6FA;
  }
  h1 .hl {
    background: linear-gradient(170deg, #F8DCA8 0%, #E8B464 46%, #C0892C 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    margin-top: 26px; font-size: 31px; line-height: 1.5;
    color: #9AA3B4; font-weight: 500; letter-spacing: .2px;
  }
  .sub b { color: #E8B464; font-weight: 600; }

  .shot {
    margin-top: 34px; position: relative; width: 92%; align-self: center;
    border-radius: 24px; overflow: hidden;
    border: 1px solid rgba(232,180,100,.20);
    box-shadow: 0 60px 100px -40px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.03);
    background: #0E1014;
  }
  .shot img { display: block; width: 100%; }

  .chips { margin-top: auto; display: flex; gap: 18px; }
  .chip {
    flex: 1; padding: 26px 16px; border-radius: 24px; text-align: center;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.075);
  }
  .chip .k { font-size: 31px; font-weight: 800; color: #F0E2C8; letter-spacing: .5px; }
  .chip .v { margin-top: 7px; font-size: 18px; color: #78818F; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">账</div>
        <div>
          <div class="brand-t">墨账 Ink Ledger</div>
          <div class="brand-s">桌面记账本</div>
        </div>
      </div>
      <div class="badge">macOS · Windows</div>
    </div>

    <h1>终于有个<br><span class="hl">安静</span>的记账本</h1>

    <div class="sub">不登录 · 不弹会员 · <b>6 MB</b><br>打开就能记，关掉就消失</div>

    <div class="shot">
      <img src="file:///Volumes/Extra/Projects/workbuddy/mini-tool/mini-ledger/design/screenshot.png">
    </div>

    <div class="chips">
      <div class="chip"><div class="k">纯本地</div><div class="v">不联网 · 不上传</div></div>
      <div class="chip"><div class="k">6 MB</div><div class="v">装完就忘掉它</div></div>
      <div class="chip"><div class="k">开源免费</div><div class="v">代码都在这儿</div></div>
    </div>
  </div>
</body>
</html>
